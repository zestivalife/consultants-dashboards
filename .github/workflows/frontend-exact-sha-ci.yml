name: Frontend Exact-SHA CI

on:
  push:
    branches:
      - codex/senior-review-authority-v1
      - codex/p0-role-workspace-routing
      - codex/p0-reliability-framework
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact frontend SHA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zestiva_practice_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}

    steps:
      - name: Validate requested SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character Git SHA" >&2
            exit 1
          fi

      - name: Check out requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REQUESTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact-SHA parity
        id: parity
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$REQUESTED_SHA" ]]; then
            echo "CI_EXACT_SHA_PARITY: FAIL" >&2
            echo "Requested: $REQUESTED_SHA" >&2
            echo "Checked out: $checked_out_sha" >&2
            exit 1
          fi
          echo "CI_EXACT_SHA_PARITY: PASS"
          echo "REQUESTED_SHA=$REQUESTED_SHA"
          echo "CHECKED_OUT_SHA=$checked_out_sha"
          echo "TESTED_SHA=$checked_out_sha"
          echo "tested_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
          echo "### Exact-SHA identity" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested SHA: \`$REQUESTED_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checked-out SHA: \`$checked_out_sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact-SHA parity: **PASS**" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out pinned Fiteatsy provider contracts
        uses: actions/checkout@v4
        with:
          repository: zestivalife/Fiteatsy-mobile
          ref: f7762c1eed4c3026913028742655d6c3f5a6e38e
          path: external/fiteatsy
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nuetra-frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/practice-operations-service/requirements.txt
            services/auth-service/requirements.txt
            api-gateway/requirements.txt

      - name: Install locked backend dependencies
        run: python -m pip install -r services/practice-operations-service/requirements.txt

      - name: Migrate isolated Practice Operations database
        working-directory: services/practice-operations-service
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/zestiva_practice_ci
        run: python -m alembic upgrade head

      - name: Run practice operations regression
        working-directory: services/practice-operations-service
        run: python -m pytest -q

      - name: Enforce provider, gateway and service configuration contracts
        working-directory: services/practice-operations-service
        run: >-
          python -m pytest -q
          tests/test_critical_api_contract_inventory.py
          tests/test_service_database_configuration_contract.py

      - name: Run database-backed Practice Operations contracts
        working-directory: services/practice-operations-service
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/zestiva_practice_ci
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zestiva_practice_ci
        run: python -m pytest -q tests/test_client_directory_postgres_integration.py tests/test_diet_plan_postgres_lifecycle.py

      - name: Install locked Auth dependencies
        run: python -m pip install -r services/auth-service/requirements.txt

      - name: Create and migrate isolated Auth database
        working-directory: services/auth-service
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/zestiva_auth_ci
        run: |
          createdb -h 127.0.0.1 -U postgres zestiva_auth_ci
          python -m alembic upgrade head

      - name: Run persisted Auth workspace-authority contract
        working-directory: services/auth-service
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/zestiva_auth_ci
          AUTH_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zestiva_auth_ci
        run: python -m pytest -q tests/test_workspace_authority_postgres_integration.py

      - name: Install locked gateway dependencies
        run: python -m pip install -r api-gateway/requirements.txt

      - name: Run gateway regression
        working-directory: api-gateway
        run: python -m pytest -q

      - name: Install locked dependencies
        working-directory: nuetra-frontend
        run: npm ci

      - name: Run Senior Review focused regression
        working-directory: nuetra-frontend
        run: node --test tests/senior-diet-plan-review.test.mjs

      - name: Enforce executable consumer-provider compatibility
        working-directory: nuetra-frontend
        run: node --test tests/api-contract-registry.test.mjs

      - name: Enforce pinned cross-repository Fiteatsy contracts
        working-directory: nuetra-frontend
        env:
          FITEATSY_ROOT: ${{ github.workspace }}/external/fiteatsy
        run: node scripts/verify-fiteatsy-contracts.mjs

      - name: Install pinned Fiteatsy backend dependencies
        working-directory: external/fiteatsy/backend
        run: npm ci

      - name: Create isolated Fiteatsy contract database
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres fiteatsy_test_contract_ci

      - name: Verify real Fiteatsy delegated health response schema
        working-directory: external/fiteatsy/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fiteatsy_test_contract_ci
          NODE_ENV: test
          FITEATSY_ALLOW_DESTRUCTIVE_TEST_RESET: 'true'
        run: >-
          node --import tsx --test --test-concurrency=1
          ../tests/api/external-consultant-health-context.api.test.ts

      - name: Run full frontend regression
        working-directory: nuetra-frontend
        run: node --test tests/*.test.mjs

      - name: Build production frontend
        working-directory: nuetra-frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_BUILD_COMMIT_SHA: ${{ steps.parity.outputs.tested_sha }}
        run: npm run build

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Report tested SHA
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          test "$tested_sha" = "$REQUESTED_SHA"
          echo "Frontend validation passed for exact SHA: $tested_sha"
          echo "- Tested SHA: \`$tested_sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Focused regression: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full frontend regression: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Practice operations regression: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- PostgreSQL integration contracts: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auth workspace-authority contract: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gateway regression: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Executable API compatibility contracts: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Assessment/Nutrition/Scoring configuration contracts: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production build: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- git diff --check: **PASS**" >> "$GITHUB_STEP_SUMMARY"
