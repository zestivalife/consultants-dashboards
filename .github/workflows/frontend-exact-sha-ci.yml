name: Frontend Exact-SHA CI

on:
  push:
    branches:
      - codex/senior-review-authority-v1
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact frontend SHA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zestiva_ci
          POSTGRES_PASSWORD: zestiva_ci
          POSTGRES_DB: practice_operations_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zestiva_ci -d practice_operations_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
      DATABASE_URL: postgresql+asyncpg://zestiva_ci:zestiva_ci@127.0.0.1:5432/practice_operations_ci
      TEST_DATABASE_URL: postgresql+asyncpg://zestiva_ci:zestiva_ci@127.0.0.1:5432/practice_operations_ci

    steps:
      - name: Validate requested SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character Git SHA" >&2
            exit 1
          fi

      - name: Check out requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact-SHA parity
        id: parity
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$REQUESTED_SHA" ]]; then
            echo "CI_EXACT_SHA_PARITY: FAIL" >&2
            echo "Requested: $REQUESTED_SHA" >&2
            echo "Checked out: $checked_out_sha" >&2
            exit 1
          fi
          echo "CI_EXACT_SHA_PARITY: PASS"
          echo "REQUESTED_SHA=$REQUESTED_SHA"
          echo "CHECKED_OUT_SHA=$checked_out_sha"
          echo "TESTED_SHA=$checked_out_sha"
          echo "tested_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
          echo "### Exact-SHA identity" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested SHA: \`$REQUESTED_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checked-out SHA: \`$checked_out_sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact-SHA parity: **PASS**" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nuetra-frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/auth-service/requirements.txt
            services/practice-operations-service/requirements.txt
            api-gateway/requirements.txt

      - name: Install locked authentication dependencies
        run: python -m pip install -r services/auth-service/requirements.txt

      - name: Run authentication and tenant-resolution regression
        working-directory: services/auth-service
        run: python -m pytest -q

      - name: Install locked backend dependencies
        run: python -m pip install -r services/practice-operations-service/requirements.txt

      - name: Apply practice operations migrations to isolated PostgreSQL
        working-directory: services/practice-operations-service
        run: alembic upgrade head

      - name: Run practice operations regression
        working-directory: services/practice-operations-service
        run: python -m pytest -q

      - name: Install locked gateway dependencies
        run: python -m pip install -r api-gateway/requirements.txt

      - name: Run gateway regression
        working-directory: api-gateway
        run: python -m pytest -q

      - name: Install locked dependencies
        working-directory: nuetra-frontend
        run: npm ci

      - name: Run Senior Review focused regression
        working-directory: nuetra-frontend
        run: node --test tests/senior-diet-plan-review.test.mjs

      - name: Run full frontend regression
        working-directory: nuetra-frontend
        run: node --test tests/*.test.mjs

      - name: Build production frontend
        working-directory: nuetra-frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_BUILD_COMMIT_SHA: ${{ steps.parity.outputs.tested_sha }}
        run: npm run build

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Report tested SHA
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          test "$tested_sha" = "$REQUESTED_SHA"
          echo "Frontend validation passed for exact SHA: $tested_sha"
          echo "- Tested SHA: \`$tested_sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Focused regression: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full frontend regression: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authentication and tenant regression: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Practice operations regression: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Isolated PostgreSQL migrations and Connection PIN lifecycle: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gateway regression: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production build: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- git diff --check: **PASS**" >> "$GITHUB_STEP_SUMMARY"
